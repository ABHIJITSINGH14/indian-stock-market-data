name: Download Stock Market Data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/download-data.yml
      - .github/workflows/analyze-data.yml
      - requirements.txt
  schedule:
    # Run at 5 AM IST (11:30 PM UTC previous day) every weekday
    - cron: '30 23 * * 1-5'
  
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  download-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run data downloads
      run: python -m scripts.run_all
    
    - name: Upload data artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: downloaded-data
        path: data/raw/
        if-no-files-found: error
        retention-days: 30
    
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: download-logs
        path: logs/
        retention-days: 7
