name: Download Stock Market Data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/download-data.yml
      - .github/workflows/analyze-data.yml
      - requirements.txt
      - scripts/download_nse_data.py
      - scripts/download_fundamentals.py
      - config/issuer_identity.py
  schedule:
    # Run at 5 AM IST (11:30 PM UTC previous day) every weekday
    - cron: '30 23 * * 1-5'
  
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  download-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run data downloads
      timeout-minutes: 15
      run: python -m scripts.run_all
    
    - name: Upload complete-task data artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: downloaded-data
        path: data/raw/*.csv
        if-no-files-found: error
        retention-days: 30
    
    - name: Preserve partial task outputs under a distinct name
      if: ${{ failure() && hashFiles('data/raw/*.csv') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: partial-download-data-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/raw/*.csv
        if-no-files-found: error
        retention-days: 7

    - name: Preserve exact price rejection evidence separately
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: price-rejection-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: data/raw/price-rejections/
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: download-logs
        path: logs/
        retention-days: 7
