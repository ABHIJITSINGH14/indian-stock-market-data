name: Historical price rejection audit
# A rejected frame remains a FAILED run; saved diagnostic subsets are not production data.
on:
  push:
    branches: [fix/price-rejection-evidence]
    paths:
      - .github/workflows/price-rejection-audit.yml
      - scripts/download_nse_data.py
      - scripts/audit_price_history.py
      - utils/price_evidence.py
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: yahoo-historical-price-diagnostic
  cancel-in-progress: false

jobs:
  price-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Offline contracts before one provider request
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: One issuer, unchanged configured historical range, strict admission
        timeout-minutes: 2
        run: python -m scripts.audit_price_history --directory "$RUNNER_TEMP/historical-price-audit"
      - name: Preserve rejection evidence without turning failure into success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-price-audit/
          retention-days: 7
          if-no-files-found: warn
