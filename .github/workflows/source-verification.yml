name: Live source compatibility check
on:
  push:
    branches: [fix/live-source-restoration]
    paths: [.github/workflows/source-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install isolated candidate dependency set
      shell: bash
      run: |
        sed 's/^yfinance==0.2.32$/yfinance==1.7.0/' requirements.txt > "$RUNNER_TEMP/candidate-requirements.txt"
        python -m pip install -r "$RUNNER_TEMP/candidate-requirements.txt"
        python -m pip check
    - name: Inspect remaining provider boundaries (metadata only)
      timeout-minutes: 2
      shell: bash
      run: |
        python - <<'PY'
        import hashlib, json, math, os
        from pathlib import Path
        from urllib.parse import urljoin, urlparse
        import requests
        import yfinance as yf
        results = {'run_id': os.environ['GITHUB_RUN_ID'], 'sha': os.environ['GITHUB_SHA'],
                   'scope': 'provider metadata only; no price retry and no NSE website collection'}
        try:
            info = yf.Ticker('RELIANCE.NS').get_info()
            cap = info.get('marketCap')
            results['yahoo_fundamentals'] = {
                'payload_type': type(info).__name__, 'fields': sorted(info),
                'market_cap_type': type(cap).__name__, 'market_cap_present': cap is not None,
                'symbol_matches': info.get('symbol') == 'RELIANCE.NS',
                'status': 'success' if isinstance(cap, (int, float)) and math.isfinite(cap) and cap > 0 else 'failure',
            }
        except Exception as exc:
            results['yahoo_fundamentals'] = {'status': 'failure', 'exception_type': type(exc).__name__, 'message': str(exc)[:240]}
        try:
            session = requests.Session()
            session.headers.update({'User-Agent': 'IndianMarketDataPersonalResearch/1.0', 'Accept': 'application/json'})
            request = requests.Request('GET', 'https://api.bseindia.com/BseIndiaAPI/api/ListofScripData/w',
                params={'Group': '', 'Scripcode': '', 'industry': '', 'segment': 'Equity', 'status': 'Active'}).prepare()
            url = request.url
            redirects = []
            for hop in range(3):
                with session.get(url, timeout=(10, 20), allow_redirects=False) as response:
                    metadata = {'url': url, 'http_status': response.status_code,
                                'content_type': response.headers.get('Content-Type'),
                                'bytes': len(response.content), 'location': response.headers.get('Location')}
                    redirects.append(metadata)
                    results['bse_master'] = {'status': 'failure', 'hops': redirects}
                    response.raise_for_status()
                    if response.status_code in (301, 302, 303, 307, 308):
                        target = urljoin(url, response.headers['Location'])
                        parsed = urlparse(target)
                        if parsed.scheme != 'https' or parsed.username or parsed.password or not (
                            parsed.hostname == 'bseindia.com' or parsed.hostname.endswith('.bseindia.com')):
                            raise ValueError('Redirect outside approved HTTPS BSE domain; not followed')
                        url = target
                        continue
                    if response.status_code != 200:
                        raise ValueError('Unexpected status')
                    payload = response.json()
                    rows = payload if isinstance(payload, list) else payload.get('Table', [])
                    if not rows or not isinstance(rows[0], dict):
                        raise ValueError('No verified master rows')
                    results['bse_master'].update({'status': 'success', 'rows': len(rows),
                        'fields': sorted(rows[0]), 'payload_sha256': hashlib.sha256(response.content).hexdigest()})
                    break
            session.close()
        except Exception as exc:
            results.setdefault('bse_master', {}).update({'status': 'failure', 'exception_type': type(exc).__name__, 'message': str(exc)[:240]})
        text = json.dumps(results, indent=2, allow_nan=False)
        print(text)
        Path(os.environ['RUNNER_TEMP'], 'source-diagnostics.json').write_text(text)
        if any(results[k].get('status') != 'success' for k in ('yahoo_fundamentals', 'bse_master')):
            raise SystemExit(1)
        PY
    - name: Preserve metadata-only diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: source-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/source-diagnostics.json
        retention-days: 7
        if-no-files-found: warn
